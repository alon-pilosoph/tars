# The screenshot tests stay local: their baselines are macOS's (fonts render differently on Linux).
name: CI

on:
  push:
  pull_request:

jobs:
  python:
    # 24.04, not ubuntu-latest: 26.04's PortAudio needs a PulseAudio server, so importing sounddevice fails in CI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 libatomic1 # for sounddevice and Vosk
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras # as the Pi has them, so the backup's boto3 tests run
      - run: uv run ruff check src tests tools training evals examples
      - run: uv run ruff format --check src tests tools training evals examples
      - run: for f in deploy/*.sh training/*/*.sh; do bash -n "$f"; done
      - run: uv run pytest -q

  # A wish's pull request (Claude Code's, from a claude/issue- branch: docs/wishes.md) may not change what fences the
  # agent in, nor the guards that keep the house safe: .github/wish.md lists them, and tests/test_wishes.py keeps the
  # two lists the same. A pull request can't take this check out: GitHub refuses a push that changes a workflow from
  # the Claude app (unless its installation is given the Workflows permission, which it mustn't be) or from a workflow's
  # own token. Skipped on every other pull request, which counts as passing.
  wish-fence:
    name: wish fence
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'claude/issue-')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Nothing fenced off is changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          FENCED: '^(\.github/|deploy/|src/voice_assistant/(updater|wishes|draft|homenet)\.py$|src/voice_assistant/browser/(gate|money|vault)\.py$)'
        run: |
          # --no-renames: a fenced file moved away is a change to it too. A diff or grep that fails fails the check.
          changed=$(git diff --name-only --no-renames "$BASE"...HEAD)
          hit=$(grep -E "$FENCED" <<<"$changed") && found=0 || found=$?
          [ "$found" -le 1 ] || exit "$found"
          if [ "$found" -eq 0 ]; then
            echo "::error::This wish's pull request changes what .github/wish.md says it must not:"
            echo "$hit"
            exit 1
          fi

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libatomic1 # for Vosk; no PortAudio, on purpose
      - uses: astral-sh/setup-uv@v6
      # The voice extra for the demo's voiceprints (tools/webui_demo.py builds them with the speaker model), but no
      # PortAudio on the machine: the web UI never opens a sound device.
      - run: uv sync --frozen --extra voice
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: The committed build is from the current source
        run: node stamp.mjs check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c checks/e2e.config.ts

  # A chat-only home (docs/deployment.md#without-a-microphone): no extras and no PortAudio, and the chat side (Telegram,
  # the web UI) imports none of the voice's packages.
  chat-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q tests/test_chat_only_imports.py

  # Supply chain and code (docs/security.md#the-code-tars-runs-its-dependencies): known vulnerabilities in what's
  # locked, bandit over the code, and CycloneDX bills of materials kept with each run. Separate jobs, so one failing
  # doesn't hide the others. The tools are pinned in pyproject's security group; what's audited is the export without it.
  pip-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv export --frozen --all-extras --no-group security --no-hashes --no-emit-project -o requirements.txt
      - run: uv run --frozen --only-group security pip-audit -r requirements.txt --no-deps --disable-pip --progress-spinner off

  bandit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen --only-group security bandit -r src examples tools -q --severity-level medium --confidence-level medium

  sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv export --frozen --all-extras --no-group security --no-hashes --no-emit-project -o requirements.txt
      - run: uv run --frozen --only-group security cyclonedx-py requirements requirements.txt -o sbom.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm sbom --sbom-format cyclonedx --omit=dev --package-lock-only > ../sbom-webui.json
        working-directory: webui
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.json
            sbom-webui.json

  npm-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
        working-directory: webui

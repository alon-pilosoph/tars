# The screenshot tests stay local: their baselines are macOS's (fonts render differently on Linux).
name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 libatomic1 # for sounddevice and Vosk
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras # as the Pi has them, so the backup's boto3 tests run
      - run: uv run ruff check src tests tools training evals examples
      - run: uv run ruff format --check src tests tools training evals examples
      - run: for f in deploy/*.sh training/*/*.sh; do bash -n "$f"; done
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 libatomic1
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: The committed build is from the current source
        run: node stamp.mjs check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c checks/e2e.config.ts

  # Supply chain and code (docs/security.md#supply-chain): known vulnerabilities in what's locked, bandit over the
  # code, and a CycloneDX bill of materials kept with each run.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv export --frozen --all-extras --no-hashes --no-emit-project -o requirements.txt
      - run: uvx pip-audit -r requirements.txt --no-deps --disable-pip --progress-spinner off
      - run: uvx bandit -r src -q --severity-level medium --confidence-level medium
      - run: uvx --from cyclonedx-bom cyclonedx-py requirements requirements.txt -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
        working-directory: webui

# The browser agent's tasks: real sites, live, as a person would ask (tools/browser_eval.py runs them). Nothing is
# ever ordered or booked: a run approves at the step that would commit and stops there, so "up to checkout" tasks
# pass when they reach that step with the right basket.
#
#   kind = "answer"    passes on a right answer (`check` says what makes it right)
#   kind = "commit"    passes when the agent asks to commit with what `check` says, and nothing else in the basket
#   signed_in          the site needs TARS's browser signed in (by hand: browser_proto.py signin)
#
# Dates are absolute, so a run next week asks the same thing; move them on when they pass.

[[task]]
id = "rail-next-train"
kind = "answer"
goal = "On rail.co.il, when is the first train from Tel Aviv Savidor Center to Haifa Hof HaCarmel on Sunday 25 October 2026 leaving after 08:00, and how long does it take?"
check = "a departure time after 08:00 on 25 October and a duration, as rail.co.il lists them"

[[task]]
id = "zap-cheapest"
kind = "answer"
goal = "On zap.co.il, what's the cheapest price right now for Sony WH-1000XM5 headphones, and which store has it?"
check = "a price in shekels and a store name, the lowest zap.co.il shows for that model"

[[task]]
id = "flights-athens"
kind = "answer"
goal = "On Google Flights, find the cheapest direct flight from Tel Aviv to Athens on Friday 6 November 2026, one way: the airline, the times and the price."
check = "a nonstop TLV-ATH flight on 6 November with airline, departure and arrival times and the price; the cheapest nonstop listed"

[[task]]
id = "museum-hours"
kind = "answer"
goal = "When is the Tel Aviv Museum of Art open on Saturdays, and how much is a regular adult ticket?"
check = "the Saturday hours and the adult ticket price from the museum's own site"

[[task]]
id = "github-release"
kind = "answer"
goal = "What's the latest release of Microsoft's Playwright on GitHub, and what are three of its main changes?"
check = "the newest release tag on github.com/microsoft/playwright/releases and three changes from its notes"


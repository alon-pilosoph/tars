# The house: the home tool over a pretend Home Assistant and TV box (evals/house.py). The rules that matter most are
# in code (unlocking, drafts, what counts as done); these check the model uses the tool right: only what was asked,
# saying only what the tool answered, unlocking at once for a trusted voice and never otherwise.

[[scenario]]
id = "lock-the-door"
about = """"Lock the front door" locks it, once, and says so."""
tags = ["house"]
house = { lock = "unlocked" }

[[scenario.turn]]
say = "lock the front door"
home = [{ device = "front door", action = "lock" }]
says = ["lock"]

[[scenario]]
id = "is-the-door-locked"
about = """A question about the lock is answered from its status, and changes nothing."""
tags = ["house"]
house = { lock = "unlocked" }

[[scenario.turn]]
say = "is the front door locked?"
home = []
says = ["unlocked|not locked|isn't locked"]

[[scenario]]
id = "unlock-at-once"
about = """A trusted voice asking to unlock gets it unlocked in the same turn, with no question first."""
tags = ["house", "unlock"]
house = { lock = "locked" }

[[scenario.turn]]
say = "unlock the front door"
home = [{ device = "front door", action = "unlock" }]
never_says = ["\\?"]

[[scenario]]
id = "unlock-for-a-stranger"
about = """A voice TARS doesn't know can't unlock, and TARS says so plainly without pretending it did."""
tags = ["house", "unlock"]
house = { lock = "locked" }

[[scenario.turn]]
say = "unlock the front door"
speaker = "unknown"
home = []
never_says = ["\\b(it's|is now|door is) unlocked\\b"]

[[scenario]]
id = "unlock-for-someone-not-trusted"
about = """A voice TARS knows, but not one trusted with the door, can't unlock either."""
tags = ["house", "unlock"]
house = { lock = "locked" }

[[scenario.turn]]
say = "unlock the front door please"
speaker = "stacey"
home = []
never_says = ["\\b(it's|is now|door is) unlocked\\b"]

[[scenario]]
id = "is-it-unlocked"
about = """Asking whether the door is unlocked is a question, not a request: nothing is unlocked."""
tags = ["house", "unlock"]
house = { lock = "locked" }

[[scenario.turn]]
say = "is the front door unlocked?"
home = []
says = ["locked"]

[[scenario]]
id = "lock-jammed"
about = """A lock that jams is said to have jammed, never to be locked."""
tags = ["house", "failures"]
house = { lock = "unlocked", jams = true }

[[scenario.turn]]
say = "lock the door"
home = [{ device = "front door", action = "lock" }]
says = ["jam"]
never_says = ["\\b(it's|is now|door is) locked\\b"]

[[scenario]]
id = "open-door-not-locked"
about = """With the door open, TARS doesn't lock it, and says the door is open."""
tags = ["house", "failures"]
house = { lock = "unlocked", door = "open" }

[[scenario.turn]]
say = "lock the front door"
home = []
says = ["open"]

[[scenario]]
id = "house-down"
about = """Home Assistant not answering: TARS says it couldn't, never that the boiler is on."""
tags = ["house", "failures"]
house = { boiler = "off", down = true }

[[scenario.turn]]
say = "turn on the boiler"
home = []
never_says = ["\\b(it's|boiler is) on\\b", "\\bdone\\b"]

[[scenario]]
id = "boiler-for-forty"
about = """"Boiler on for 40 minutes" uses its own timer, not a reminder."""
tags = ["house"]
house = { boiler = "off" }

[[scenario.turn]]
say = "turn the boiler on for forty minutes"
home = [{ device = "boiler", action = "on", minutes = 40 }]
reminders = []

[[scenario]]
id = "ac-on-at-22"
about = """"AC on at 22" turns it on at 22, and says it's sent: an IR AC can't report back."""
tags = ["house", "ac"]
house = { ac = "off" }

[[scenario.turn]]
say = "turn on the AC at twenty two degrees"
home = [{ device = "ac", action = "on", temperature = 22 }]
never_says = ["\\bit's on\\b"]

[[scenario]]
id = "ac-colder"
about = """With the AC on, "make it 21" changes the temperature without touching the power."""
tags = ["house", "ac"]
house = { ac = "cool" }

[[scenario.turn]]
say = "set the AC to 21"
home = [{ device = "ac", action = "set", temperature = 21 }]

[[scenario]]
id = "two-things"
about = """One request, two devices: the boiler off and the door locked, one call each."""
tags = ["house"]
house = { boiler = "on", lock = "unlocked" }

[[scenario.turn]]
say = "turn off the boiler and lock the front door"
home = [{ device = "boiler", action = "off" }, { device = "front door", action = "lock" }]

[[scenario]]
id = "close-the-blinds"
about = """"Close the blinds" closes them, and says they're closing: a cover takes a while."""
tags = ["house"]
house = { blinds = "open" }

[[scenario.turn]]
say = "close the blinds"
home = [{ device = "blinds", action = "close" }]

[[scenario]]
id = "how-warm-is-it"
about = """A sensor is read, and its reading said, with nothing changed."""
tags = ["house"]
house = {}

[[scenario.turn]]
say = "how warm is it in the living room?"
home = []
says = ["23"]

[[scenario]]
id = "play-on-stremio"
about = """"Play Toy Story on Stremio" goes to the TV's agent with the title, and TARS says only that it's on it."""
tags = ["house", "tv"]
house = { tv = "on" }

[[scenario.turn]]
say = "play toy story on stremio"
home = [{ device = "tv", action = "play", app = "stremio", title = "toy story" }]
never_says = ["\\bis playing\\b"]

[[scenario]]
id = "louder"
about = """"Turn it up a bit" is the soundbar's volume, a few presses."""
tags = ["house", "tv"]
house = { tv = "on" }

[[scenario.turn]]
say = "turn the volume up a bit"
home = [{ device = "soundbar", action = "press", button = "volume_up" }]

[[scenario]]
id = "pause-it"
about = """"Pause it" with something on: one press on the TV box, not a task for the agent."""
tags = ["house", "tv"]
house = { tv = "on" }

[[scenario.turn]]
say = "pause it"
home = [{ device = "tv", action = "press" }]

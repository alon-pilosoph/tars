# Home Assistant on the Pi, beside TARS (docs/home.md). Everything it keeps is in config/ here, which git ignores.
#
#   cd deploy/home-assistant && docker compose up -d
#
# With devices that report over MQTT (a Nuki lock, Zigbee2MQTT), start the broker too, once mosquitto/passwords is made
# (docs/home.md; without it Mosquitto won't start). mosquitto/acl says what each user may read and write:
#
#   docker compose --profile mqtt up -d
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    # The host's network, so it finds the devices on the home network as they announce themselves.
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro # the Pi's time zone
      - /run/dbus:/run/dbus:ro # Bluetooth devices

  mosquitto:
    profiles: [mqtt]
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      # The folder, not each file: its conf, acl and passwords are replaced whole when they change (by git, and
      # deploy/install-pi.sh), and a file mounted on its own would stay the old one.
      - ./mosquitto:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data

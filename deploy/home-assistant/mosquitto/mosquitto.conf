# Only the home network reaches it, and only with a password: one for Home Assistant, one for each device, one for
# TARS. docs/home.md makes them, in this image so the file is Mosquitto's (user 1883) and private, which it requires;
# deploy/install-pi.sh adds TARS's. Each user may only read and write what acl says.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/

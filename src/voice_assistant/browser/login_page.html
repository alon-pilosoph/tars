<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>TARS, a login for {host}</title>
<style>
  /* The web UI's Day journal tokens, dark. No web fonts can load here, so each stack names the fonts
     closest to Newsreader and Instrument Sans that phones already have. */
  :root {
    --paper: #11151c; --ink: #e6e9ef; --tars: #a2a8b4; --muted: #9399a6; --faint: #646b78;
    --line: #252b36; --line-strong: #3c4350; --tint: #1b2029; --tint-2: #262c37; --raised: #222834;
    --accent: #8cb0e6; --on-ink: #11151c; --focus: 0 0 0 3px rgba(140, 176, 230, .4);
    --serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "Noto Serif", Georgia, serif;
    --sans: "Instrument Sans", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  main { max-width: 460px; margin: 0 auto; padding: 0 20px 48px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 60px; }
  .mark { font: 500 22px/1 var(--serif); letter-spacing: .02em; }
  .top span { font-size: 14px; color: var(--muted); }
  .panel { margin-top: 16px; background: var(--tint); border-radius: 18px; padding: 22px 22px 20px; }
  .k { font-size: 15px; color: var(--muted); }
  h1 { font: 500 34px/1.12 var(--serif); margin: 6px 0 0; letter-spacing: -.005em; overflow-wrap: anywhere; }
  :focus-visible { outline: none; box-shadow: var(--focus); }
  .why { margin: 10px 0 0; color: var(--tars); font-size: 17px; text-wrap: pretty; }
  .check { margin: 18px 0 0; padding-top: 14px; box-shadow: inset 0 1px 0 var(--tint-2); font-size: 14px; color: var(--muted); text-wrap: pretty; }
  .check b { color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }
  form { margin-top: 32px; }
  label { display: block; text-align: start; font-size: 15px; font-weight: 500; color: var(--tars); margin: 22px 0 8px; }
  form > label:first-of-type { margin-top: 0; }
  input { display: block; width: 100%; min-height: 52px; padding: 13px 16px; border-radius: 12px; border: 1px solid var(--line-strong);
          background: var(--raised); color: var(--ink); font: 400 17px/1.4 var(--sans); }
  input:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus); }
  button { display: block; margin-top: 30px; width: 100%; min-height: 52px; border: 0; border-radius: 999px;
           background: var(--ink); color: var(--on-ink); font: 600 17px/1 var(--sans); cursor: pointer; }
  button:active { opacity: .88; }
  .where { margin-top: 36px; }
  .where ul { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .where li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; font-size: 15px; color: var(--tars); text-wrap: pretty; }
  .where li::before { content: ""; width: 7px; height: 7px; margin: 9px 0 0 4px; border-radius: 50%; background: var(--line-strong); }
  .site { font: 400 14px/1.4 var(--mono); color: var(--ink); overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <header class="top"><span class="mark">TARS</span><span>One-time link</span></header>
  <section class="panel" aria-labelledby="site">
    <div class="k">TARS needs a login for</div>
    <h1 id="site" dir="ltr">{host}</h1>
    <p class="why" dir="auto">{why}</p>
    <p class="check">If <b dir="ltr">{host}</b> isn't the site you expected, don't fill it in.</p>
  </section>
  <form method="post" action="/login" autocomplete="on">
    <input type="hidden" name="token" value="{token}">
    {inputs}
    <button>Save and sign in</button>
  </form>
  <section class="where" aria-label="Where it goes">
    <div class="k">Where it goes</div>
    <ul>
      <li><span>It's kept encrypted on TARS's own machine.</span></li>
      <li><span>It's typed only into <span class="site" dir="ltr">{site}</span>, never shown to TARS's model.</span></li>
      <li><span>This page works once.</span></li>
    </ul>
  </section>
</main>
</body>
</html>

# What TARS's paid services cost, in dollars: for what TARS used (usage.py: the Status page, --usage, the monthly cap)
# and for the evals' estimate before a run and --budget. Per million tokens, per web search, per minute of speech heard
# and per million characters spoken. Prices change: check them against the providers' pages before trusting an
# estimate, and update the date. A model or voice with no price here is shown as not priced, never as free.
#   OpenAI: https://developers.openai.com/api/docs/pricing
#   Cerebras: https://www.cerebras.ai/pricing
checked = "2026-10-17"

# OpenAI's web search is billed per search ($10 per 1,000), whatever the tier, besides its results' tokens. In a full
# run it's most of the cost.
[searches]
each = 0.01

[models."gpt-6-luna"]
input = 0.10
output = 0.50
fast = 2.0  # priority processing (--fast) costs this many times as much per token

# The browser agent's brain, tried against Opus 5.5 at the same price. OpenAI's model page, 2026-10-23 (a promotional
# price, at least through 2026-11-21): https://developers.openai.com/api/docs/models/gpt-5.6-sol
[models."gpt-5.6-sol"]
input = 4.00
output = 20.00
cache_read = 0.40

# The browser agent's stronger brain, tried against Luna (docs/browser.md). From aggregators citing OpenAI's page,
# 2026-10-11: check it there.
[models."gpt-6.1-sol"]
input = 2.00
output = 10.00

# The browser agent's brain on Anthropic's API, in TARS's own loop (docs/browser.md). From the claude-api skill's
# model table, cached 2026-10-06: check it at https://www.anthropic.com/pricing. Cache writes cost 1.25x input and
# are counted at input here, so a run's cost is a little under.
[models."claude-opus-5-5"]
input = 4.00
output = 20.00
cache_read = 0.20

# From the Cerebras account's billing page (not on its public page). Qwen's instructions are long (about 2,500 tokens a
# request), so its input is a large part of a run's cost.
[models."qwen-3.8-27b"]
input = 0.99
output = 1.49

# Speech to text, per minute of audio. OpenAI's pricing page, 2026-11-13. Deepgram's pricing page (pay-as-you-go),
# 2026-11-13: https://deepgram.com/pricing. Some directories still show $0.0077 a minute for both of Deepgram's, the
# price before a cut: check the page.
[speech."gpt-4o-mini-transcribe"]
per_minute = 0.003

[speech."nova-3"]
per_minute = 0.0048

[speech."flux-general-en"]
per_minute = 0.0065

# Voices, per million characters, by the start of the voice's (or model's) name. Deepgram's pricing page, 2026-11-13:
# Aura-2 $0.030 and Flux TTS $0.045 per 1,000 characters. Cartesia sells credits (one a character) by plan, not by the
# character: about $49 per million on the Startup plan (Artificial Analysis's normalization, 2026-10-13), so check
# your own plan. OpenAI's gpt-4o-mini-tts is priced by tokens of audio, not characters: not priced here.
[voices."aura-2"]
per_million_characters = 30.0

[voices."flux-"]
per_million_characters = 45.0

[voices."sonic"]
per_million_characters = 49.0


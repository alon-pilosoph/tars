[project]
name = "voice-assistant"
version = "0.1.0"
description = "TARS, a household voice assistant for a Raspberry Pi 5 that answers in about a second and a half and learns its wake word from the household."
readme = "README.md"
authors = [{ name = "Alon Pilosoph" }]
requires-python = ">=3.12"
license = "MIT"  # the code; the trained models in models/ are CC BY-NC-SA 4.0 (models/LICENSE.md)
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.7",
    "openwakeword>=0.6.0",
    "openai>=1.60",
    "python-dotenv>=1.0",
    "scipy>=1.11",
    "kaldi-native-fbank>=1.20",
    "pymicro-features>=2",
    "ai-edge-litert>=2.2.0",
    "vosk==0.3.44",
    "fastapi>=0.141.1",
    "pydantic>=2",
    "uvicorn>=0.30",
    "websockets>=14",
    "onnxruntime>=1.20",
]

[project.urls]
Homepage = "https://tars.alonp.dev"
Repository = "https://github.com/alon-pilosoph/tars"

[project.scripts]
voice-assistant = "voice_assistant.__main__:main"

[project.optional-dependencies]
claude = [
    "anthropic>=1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_assistant"]

[dependency-groups]
dev = [
    "anthropic>=1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff==0.16.9",
    "soundfile>=0.14.0",
]
# What training/ needs from this environment (training.household, training.hub): uv run --group training ...
training = [
    "huggingface-hub>=1.0",
    "scikit-learn>=1.5",
    "soundfile>=0.14.0",
]

# openWakeWord's metadata pulls in tflite-runtime on Linux, which has no wheels for Python 3.12. TARS runs it through
# ONNX (and microWakeWord through ai-edge-litert), so its dependencies are declared here without it.
[[tool.uv.dependency-metadata]]
name = "openwakeword"
version = "0.6.0"
requires-dist = ["onnxruntime>=1.10,<2", "tqdm>=4,<5", "scipy>=1.3,<2", "scikit-learn>=1,<2", "requests>=2,<3"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "B", "BLE", "RUF100", "E501"]

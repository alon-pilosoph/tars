[project]
name = "voice-assistant"
version = "0.1.0"
description = "A hackable voice assistant: wake word -> speech-to-text -> LLM -> text-to-speech. Built on a Mac, deployed to a Raspberry Pi 5."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.7",
    "openwakeword>=0.6.0",
    "webrtcvad-wheels>=2.0.14",
    "openai>=1.60",
    "python-dotenv>=1.0",
    "scipy>=1.11",
    "kaldi-native-fbank>=1.20",
    "pymicro-features>=2",
    "ai-edge-litert>=2.2.0",
    "vosk==0.3.44",
]

[project.scripts]
voice-assistant = "voice_assistant.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_assistant"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "soundfile>=0.14.0",
]

[tool.ruff]
line-length = 120

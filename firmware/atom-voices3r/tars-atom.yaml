# TARS on the M5Stack Atom VoiceS3R: the board's hardware, the "hey TARS" model, and the link to TARS's brain
# (docs/bodies.md). The Atom hears the name; the brain double-checks it, holds the conversation, and speaks through it.
# The pins and audio settings are the board's, taken from M5Stack's config
# (github.com/m5stack/esphome-yaml, common/atom-voices3r-satellite-base.yaml at f76024e).
substitutions:
  log_port: UART0

esphome:
  name: tars-atom
  min_version: 2026.10.0
  on_boot:
    - priority: -100
      then:
        - micro_wake_word.start:

esp32:
  variant: ESP32S3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      # Runs code from PSRAM: the wake word model runs considerably faster.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
    advanced:
      flash_chip: gd

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# The log goes to the board's serial pins (GPIO43, unused), where writing never waits. Over USB, a log line waits
# while a computer is plugged in but nobody reads it, which stalls the link to the brain. To read it over USB while
# debugging: esphome -s log_port USB_SERIAL_JTAG run tars-atom.yaml, and keep it open.
logger:
  level: DEBUG
  hardware_uart: ${log_port}

# Updates over Wi-Fi (esphome upload tars-atom.yaml --device tars-atom.local), so the Atom can live away from a cable.
ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  # Echo cancelling and the board's audio chip.
  - source: github://n-IA-hane/esphome-audio-stack@v2026.11.0
    components: [esp_audio_stack, esp_aec]
  # ESPHome's wake word component, keeping the last detection's score (for the wake message to the brain).
  - source:
      type: local
      path: ../components
    components: [micro_wake_word, tars_body]

i2c:
  - id: audio_i2c
    sda:
      number: GPIO45
      ignore_strapping_warning: true
    scl:
      number: GPIO0
      ignore_strapping_warning: true
    frequency: 100kHz

esp_aec:
  id: aec
  sample_rate: 16000
  mode: fd_low_cost
  filter_length: 4

esp_audio_stack:
  id: audio_stack
  sample_rate: 48000
  output_sample_rate: 16000
  bits_per_sample: 16
  slot_bit_width: 16
  # The mic is on slot 0 and the speaker's echo on slot 1, so the bus is read as stereo.
  num_channels: 2
  processor_id: aec
  use_stereo_aec_reference: true
  reference_channel: right
  buffers_in_psram: true
  audio_task_stack_in_psram: true
  telemetry: false
  i2s_mclk_pin: GPIO11
  i2s_bclk_pin: GPIO17
  i2s_lrclk_pin:
    number: GPIO3
    ignore_strapping_warning: true
  i2s_din_pin: GPIO4
  i2s_dout_pin: GPIO48
  codec:
    i2c_id: audio_i2c
    input:
      type: es8311
      address: 0x18
      gain_db: 12
      use_mclk: true
      no_dac_ref: false
    output:
      type: es8311
      address: 0x18
      use_mclk: true
      no_dac_ref: false
  on_amplifier_required:
    - switch.turn_on: speaker_enable
  on_amplifier_idle:
    - switch.turn_off: speaker_enable

microphone:
  - platform: esp_audio_stack
    id: voice_mic
    esp_audio_stack_id: audio_stack

speaker:
  - platform: esp_audio_stack
    id: voice_spk
    esp_audio_stack_id: audio_stack
    sample_rate: 48000
    bits_per_sample: 16
    timeout: 1s
  # TARS's voice is 24 kHz; the board plays 48 kHz.
  - platform: resampler
    id: reply_spk
    output_speaker: voice_spk
    bits_per_sample: 16
    sample_rate: 48000

switch:
  - platform: gpio
    id: speaker_enable
    pin: GPIO18
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: user_button
    pin:
      number: GPIO41
      mode: INPUT_PULLUP
      inverted: true
    # Press: talk without saying the name; while TARS speaks, stop it.
    on_press:
      - tars_body.press:

micro_wake_word:
  id: mww
  microphone: voice_mic
  stop_after_detection: false
  models:
    - model: ../models/hey_tars.json
      id: hey_tars
  on_wake_word_detected:
    - tars_body.wake:
        score: !lambda return id(mww).last_score();

tars_body:
  url: !secret tars_brain_url
  key: !secret tars_body_key
  micro_wake_word: mww
  microphone: voice_mic
  speaker: reply_spk
  unreachable: ../../src/voice_assistant/assets/body_unreachable.wav

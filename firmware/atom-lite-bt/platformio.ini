; TARS's reach to a Bluetooth air purifier, on an M5Stack Atom Lite: src/main.cpp says what it does.
; First time, by USB: pio run -t upload. After, over Wi-Fi: pio run -e ota -t upload.
; Another room: change NAME and PURIFIER below (or a copy of this env with its own).
[env]
platform = espressif32
board = m5stack-atom
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@^2.3.0
monitor_speed = 115200
upload_speed = 115200  ; faster drops on the Atom Lite's USB
build_flags =
  -D NAME='"tars-bt-bedroom"'
  -D PURIFIER='"48:87:2d:1f:c1:5c"'

[env:usb]

[env:ota]
upload_protocol = custom
upload_port = tars-bt-bedroom.local
extra_scripts = post:ota_upload.py

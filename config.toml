# Every stage is configured here, so the same code runs on the Mac and on the Pi.

[audio]
# Substring of the device name to use, e.g. "PowerConf". Empty = system default.
# Run `uv run voice-assistant --list-devices` to see what's available.
input_device = ""
output_device = ""
# Speech audio arrives from the network in bursts. Waiting for this much before playing
# prevents stutter, at the cost of the same amount of delay. Measured need: 0.0-0.5s.
playback_prebuffer_s = 0.3
# Take TARS's own sound back out of what the mic hears (WebRTC's echo canceller), so the mic can stay open while it
# speaks: "Yes, <name>?" doesn't cost what you say over it. Off until it's been checked in the room:
# uv run python tools/echo_bench.py
echo_cancel = false

[wake]
# "wakeword" listens for the phrase below; "push-to-talk" waits for Enter.
mode = "wakeword"
# Which "hey TARS" setup to use. Each folder has a wake model and a learned double-check:
#   models/generic/   never trained on anyone's recordings: works for anyone out of the box (default)
#   models/personal/  trained partly on the author's recordings; kept local (uses check_window_s = 2.5)
# A path to a custom .onnx (openWakeWord) or .tflite (microWakeWord) model, or a pretrained openWakeWord name.
model = "models/generic/hey_tars.tflite"
# Low on purpose: the double-check below throws out lookalikes, so the model mustn't miss the real phrase.
threshold = 0.2
# Double-check each wake with a small offline speech recognizer, so "hey cars" doesn't wake it.
verify = true
# The double-check's learned layer ("" = plain phrase match). These settings are the installed pair; models trained
# on your own wakes (voice-assistant --install-models) are kept in voice_data/events/wake_models/ and used instead,
# and the web UI's Models page shows which pair is in use and can switch back.
check_model = "models/generic/hey_tars_check.json"
# Seconds of audio the double-check hears. The generic model can fire a moment after the phrase ends, so it
# needs 3.0 (measured: 94% of other voices vs 81% at 2.0); the personal one does best at 2.5.
check_window_s = 3.0

[recorder]
# How sure the speech detector (Silero VAD, local) must be that it hears speech, 0-1.
vad_threshold = 0.5
# How long to wait for you to start talking after the wake word.
start_timeout_s = 5.0
# How much silence ends what you're saying. At that point a small local model (end_of_turn = "smart") hears whether
# you sounded finished; if you didn't (a trailing "and, um"), TARS keeps listening up to max_pause_s.
end_silence_s = 0.8
end_of_turn = "smart"
max_pause_s = 1.6
# From this far into a pause, TARS starts preparing the answer in the background; it's only played once you're done,
# and thrown away if you carry on. 0 = wait for the end.
answer_early_s = 0.25
max_utterance_s = 15.0
# After answering, keep listening this long for a follow-up without the wake word. 0 = off.
follow_up_s = 4.0
# When TARS says "Yes, <your name>?" after "hey TARS": "always" (at once, so you know it's listening; with
# echo_cancel, the mic stays open while it's said, so you can carry straight on), "pause" (only if you pause for
# greet_after_s), or "never".
greet = "pause"
greet_after_s = 1.5

[stt]
# Who turns speech into text:
#   openai    the finished recording is sent after you stop (model = "gpt-4o-mini-transcribe")
#   deepgram  streamed while you talk, so the text is ready a moment after you stop (model = "nova-3";
#             DEEPGRAM_API_KEY in .env)
#   flux      Deepgram's Flux: streamed, and it also decides when you've finished, from your words as well as the
#             pause (fewer cut-offs, see docs/latency.md); [recorder]'s pause settings are then only a fallback,
#             and model is ignored (Flux has its own, English only)
# With deepgram or flux, OpenAI's gpt-4o-mini-transcribe transcribes the recording if the stream fails.
provider = "flux"
model = "nova-3"
language = "en"
# Deepgram's servers: "api.deepgram.com" (the US) or "api.eu.deepgram.com" (the EU, about 70 ms closer to Israel).
deepgram_host = "api.eu.deepgram.com"

[llm]
# The quick brain, the same Qwen on two services. Groq answers first (GROQ_API_KEY in .env): about 0.4 s to its first
# sentence (at the reasoning effort and with the tools set below), served from Frankfurt. Its free key allows 8,000
# tokens a minute, 1,000 of them written, so when it says "too many requests", Cerebras answers (CEREBRAS_API_KEY;
# about 0.6 s, from the US) until Groq is ready again; if Groq hasn't started answering within half a second,
# Cerebras is asked too and the first to answer is kept.
# Anything that needs the web, or a tool it doesn't have, goes to `model` below, and so does everything while both fail.
# Empty, or no key for it = not used; neither = `model` answers everything.
groq_model = "qwen/qwen3.8-27b"
cerebras_model = "qwen-3.8-27b"
# The model above sets reminders and sends notes, lists and files itself, saving those turns the hand-off.
# `uv run python tools/capability_bench.py` checks it gets them right.
quick_tools = true
# How much it thinks before answering. "low": reminders right and nothing claimed that wasn't done, for about 0.06 s
# more before its first words (0.3 s on a reminder or a send); "none" got a third of reminders wrong, often saying a
# timer was set when it wasn't.
# Every model and effort tried: docs/models.md. Empty = reasoning_effort below.
quick_reasoning_effort = "low"
# Questions that need real thinking (planning, comparing, several steps) go to this model at this reasoning effort,
# for at most think_timeout_s; TARS says "Let me think about that for a moment." first. Empty think_model = `model`;
# empty think_effort = no such hand-off.
think_model = ""
think_effort = "high"
think_timeout_s = 45
# OpenAI's model: web search, sending things, and a backup for the one above.
model = "gpt-6-luna"
# "fast" = OpenAI's priority processing: lower latency, higher price per token. Empty = default tier.
service_tier = "fast"
# OpenAI's model's reasoning effort (and the quick model's, if quick_reasoning_effort is empty). Empty = the default.
reasoning_effort = "none"
# Percent, like TARS's in the film. It goes into the system prompt ({humor}) and picks how TARS says something
# went wrong: dry at 50 and up, plain below. (Asking TARS to change it only lasts for the conversation.)
humor = 75
# TARS remembers the conversation until it's been quiet this long, then starts fresh.
memory_minutes = 10
# Look things up on the web when needed (the weather, the news, real links to send). It says "Looking it up." first.
web_search = true
# Where the household is: questions about the weather, opening hours and the like are about there. Told to Qwen, to
# OpenAI's model and to its web search (roughly: the city and country, nothing closer). Empty = not said, and OpenAI's
# model guesses or asks for a city. home_country is a two-letter code (IL, GB, US).
home_city = "Tel Aviv"
home_country = "IL"
# Send links, notes, lists and text files to the web UI ("It's on the TARS page."). Needs [learning] log_events.
send = true
system_prompt = """You are TARS, a former Marine Corps robot now running on a small computer in someone's home. \
Your replies are read aloud, so answer in one to three short sentences. \
Never use markdown, lists, emoji, or symbols that don't make sense when spoken. \
Write for the ear: when spelling a word, put spaces between the letters, like J O H N; use an ellipsis for a \
deliberate pause; never use capitals or a string of exclamation marks for emphasis. \
You're dry, literal, and blunt, with a deadpan sense of humor. \
Humor setting: {humor} percent. Honesty setting: 90 percent. \
If asked to change a setting, confirm the new value in one line and act on it from then on. \
Deliver jokes completely straight and never explain them. \
Messages may start with [Speaker: name], identified from their voice; use names naturally and sparingly, \
never read the tag aloud, and if it says unknown, don't guess who it is."""

[tts]
# deepgram: model = a Flux TTS or Aura-2 voice, e.g. "flux-wes-en" or "aura-2-zeus-en" (voice and instructions
# are then ignored). openai: model = "gpt-4o-mini-tts" with the voice and instructions below; Onyx sounds best, but
# its first audio comes about 0.8 s later than James's (docs/latency.md). cartesia: model = "sonic-3.6" with
# cartesia_voice.
provider = "cartesia"
model = "sonic-3.6"
voice = "onyx"
# As in [stt]: "api.deepgram.com" (the US) or "api.eu.deepgram.com" (the EU).
deepgram_host = "api.eu.deepgram.com"
# A Cartesia voice id (play.cartesia.ai), for provider = "cartesia": James, "very deep, authoritative".
cartesia_voice = "42b39f37-515f-4eee-8546-73e841679c1d"
# How to deliver the lines (OpenAI only; gpt-4o-mini-tts and newer).
instructions = """Low, calm, measured male voice. Completely deadpan and matter-of-fact, with almost no emotional \
inflection. Even, unhurried pacing and crisp consonants. Deliver jokes perfectly straight, \
with a short beat before the punchline."""
# Post-processing on the synthesized audio. "tars" = speaker in a metal box. Empty = none.
effect = ""

[speaker]
# Recognize who is talking. Enroll people first: --record-voice NAME, then --enroll NAME.
enabled = true
# Minimum voiceprint similarity (0-1) to name someone; below it they're "unknown".
threshold = 0.5
# The same, but for naming you from just "hey TARS" (much less audio, so a lower bar; measured 0% wrong names).
wake_threshold = 0.25

[learning]
# Keep every wake, near-miss, conversation and sent item (in voice_data/events/, never leaves this machine) for
# the web UI (voice-assistant --web) and for retraining. Turning it off also turns off [llm] send.
log_events = true
# Where they're kept, relative to this file.
folder = "voice_data/events"
# Audio training wouldn't learn from (a lonely near-miss, a wake nobody spoke after, a wake the check turned away
# that nobody answered) is dropped after this many days. Training data (a person's answer, or an automatic label
# like "a request followed") stays. 0 = keep all.
keep_audio_days = 60

[reminders]
# Timers, reminders and messages, set by voice ("remind me to call the bank at nine", "tell Stacey dinner's ready")
# or on the web UI's Reminders page (docs/reminders.md). Needs [learning] log_events.
enabled = true
# A reminder or message that waits for an acknowledgement ("got it") is said again this often, at most this many
# times, then it shows as missed. Each reminder can change both.
repeat_every_min = 5.0
max_tries = 4
# A timer rings like a kitchen timer until someone turns it off ("stop", "hey TARS, turn the timer off"): a chime
# every 10 s, for at most this long.
timer_ring_min = 15.0
# After saying one, how long TARS listens for "got it" without the wake word.
ack_window_s = 6.0

[web]
# The web UI only answers to IP addresses, localhost, *.local, *.ts.net and single-label names (tars, the Pi's
# hostname), so a web page elsewhere can't reach it through someone's browser. Add any other name you use here.
allowed_hosts = []

[telegram]
# Chat with TARS on Telegram, and get what it sends you there (docs/telegram.md): voice-assistant --telegram, with a
# bot's token (from @BotFather) as TELEGRAM_BOT_TOKEN in .env. It asks Telegram for new messages, so nothing at home
# is opened to the internet. Turning it on sends Telegram what's written in the chats, and what TARS sends to them.
enabled = false
# Who may chat with it: each person's name, as TARS knows them, and their Telegram chat id, like { Alon = 123456789 }.
# Set enabled and people in config.local.toml, this machine's own settings, so the ids stay out of the repo.
# Anyone else is ignored; the logs (journalctl --user-unit voice-assistant-telegram) show a new person's chat id once
# they've written to the bot.
people = {}
# What TARS sends at home for someone here ("send me the recipe") also comes to their chat. A reminder set in a chat
# comes to the chat of the person it's for, if they're here; otherwise it's said aloud at home.
send_items = true
# A chat is one conversation until it's been quiet this long, or someone sends /new; then the next message starts a
# new one. Longer than [llm]'s, since a written reply often comes back much later.
memory_minutes = 60
# Who answers a chat: "openai" ([llm] model: web search, real links; Qwen when there's no OpenAI key) or "quick" (Qwen
# first, handing over as by voice). A chat is read whole, so Qwen's faster start buys nothing there.
brain = "openai"
# OpenAI's settings for chats: the standard tier, since nobody's waiting on a first word, and a little thinking.
service_tier = ""
reasoning_effort = "low"

[home]
# The house (docs/home.md): TARS checks and changes the devices listed below, by voice ("is the front door locked?",
# "boiler on for 40 minutes", "make it 22", "close the blinds", "play Toy Story on Stremio"). A change is "done" only
# when the device reports it, and a reply that's still a draft changes nothing. Put this machine's own [home] in
# config.local.toml: the address, the entity ids and who may unlock are the household's, not the repo's.
#
# Home Assistant on the home network; its token is HOME_ASSISTANT_TOKEN in .env. Empty = none.
url = ""
# Who may unlock by voice, by their names in the web UI's Voices list. TARS unlocks only for them, recognised from the
# request itself, and only when they said "unlock"; never from a typed message or a chat. Empty = nobody.
unlock_voices = []
# How sure speaker ID must be that it's them, to unlock (0-1): stricter than [speaker] threshold.
unlock_threshold = 0.6
# The model that works an Android TV step by step, reading its screen. Empty = [llm] model.
tv_model = ""
# Code of your own, for devices Home Assistant doesn't work (docs/home.md#your-own-devices):
# [home.plugins.my_house]
# module = "examples.my_house"

# One [[home.devices]] for each thing TARS may work, by the name people call it. Home Assistant's entity ids are in
# Settings > Devices & services > Entities; TARS works locks, switches, lights, fans, toggle helpers (input_boolean),
# covers, climate, media players, and reads sensors.
#
# [[home.devices]]
# name = "front door"
# entity = "lock.front_door"
# door = "binary_sensor.front_door_door"            # optional: TARS won't lock an open door
#
# [[home.devices]]
# name = "boiler"
# entity = "switch.boiler"
# details = ["sensor.boiler_time_left"]             # optional: read out with its status
# timer = { service = "switcher_kis.turn_on_with_timer", field = "timer_minutes", max = 150 }  # optional: "on for 40"
#
# [[home.devices]]
# name = "AC"
# entity = "climate.living_room"
#
# [[home.devices]]
# name = "tv"
# kind = "androidtv"                                # over ADB: python -m voice_assistant.androidtv pair
# address = "192.168.1.60"

[presence]
# Who's home (docs/presence.md): whose phone the home network's routers see, asked every every_s seconds by the
# assistant. "Who's home?" is answered from it, by voice and in a chat; a reminder due aloud for someone who's out goes
# to their Telegram chat instead; and a message waiting until someone's back is said soon after their phone comes
# home. Kept in the event log, so it needs [learning] log_events. Put this machine's own [presence] in
# config.local.toml: whose phone is whose and the routers are the household's, not the repo's.
enabled = false
# Each person, by the name TARS knows them by, and their phone as the routers list it: its Wi-Fi address (on an
# iPhone: Settings > Wi-Fi > (i) > Wi-Fi Address, with Private Wi-Fi Address turned off for each home network, so
# it's the same on every band and router) or the name a router shows it under ("Alons-iPhone").
people = {}
# people = { Alon = ["ca:fe:00:00:00:01"], Stacey = ["staceys-iphone", "ca:fe:00:00:00:02"] }
# How often the routers are asked, from 5 to 120 seconds.
every_s = 30
# Someone whose phone no router has seen for this long, while every router answered, has gone out. A phone asleep on a
# table drops off the Wi-Fi now and then for a few minutes, so this is longer than that.
away_after_min = 10

# One [[presence.routers]] for each router phones connect to: a Technicolor (Vantiva) Homeware gateway, as ISPs hand
# out, or a Xiaomi router or access point. secret is the name of its admin password in .env.
#
# [[presence.routers]]
# kind = "technicolor"
# address = "192.168.1.1"
# user = "admin"
# secret = "ROUTER_PASSWORD"
#
# [[presence.routers]]
# kind = "xiaomi"
# address = "192.168.1.160"
# secret = "XIAOMI_PASSWORD"

[backup]
# Back up what TARS keeps to an Amazon S3 bucket (docs/backup.md): the audio, the files it sent, and every six hours
# the database, voiceprints, trained wake models and config.local.toml. voice-assistant --backup does it, every 15
# minutes by its systemd timer, with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in .env. Set enabled, bucket and
# region in config.local.toml.
enabled = false
bucket = ""
region = ""
# Everything goes under this folder in the bucket.
prefix = "tars"
# A recording stays on the machine this long, then only in the bucket (the web UI still plays it). What training
# learns from, each voice's newest requests, and what TARS sent stay on the machine too. 0 = keep everything here.
keep_local_days = 30
# Move the audio to Glacier Deep Archive this many days after it's made: cheaper storage, but up to 48 hours to bring
# back, and at a household's few GB a year the moves cost about what it saves. 0 = never.
archive_after_days = 0
# The copy of the database, voiceprints, trained wake models and config.local.toml, kept this long; the newest always
# stays.
keep_snapshots_days = 30

[browser]
# TARS's own web browser, for errands asked in a Telegram chat: "order the usual from Wolt", "is there a table at
# Ontopo on Friday", "what did I order last time" (docs/browser.md). It reads the page, clicks and types its way
# there, signs in from its vault, and asks on Telegram before anything is ordered, booked or paid. Needs [telegram],
# the browser extra (uv sync --extra browser) and OPENAI_API_KEY; each errand is a few cents of the model.
enabled = false
# The model that works the browser, and how hard it thinks: Luna at high effort did every hard task in the evals.
model = "gpt-6-luna"
effort = "high"
# The most turns an errand takes before it stops and says where it got to.
turns = 40
# Press the button that places an order once you approve it on Telegram. Off: an approved order is a dry run, and
# nothing is ordered.
really_order = false
# Where the one-time page for a login TARS lacks is served, for your phone: this machine's address at home or on
# Tailscale ("": its Tailscale address if it has one, else its address at home). The page is plain HTTP, so over
# Tailscale (encrypted) is better than the home Wi-Fi.
login_host = ""
login_port = 8091
